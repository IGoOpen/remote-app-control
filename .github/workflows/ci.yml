name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib viewer/lib
      - run: flutter analyze
      - run: flutter test
      - name: Analyze example
        working-directory: example
        run: flutter pub get && flutter analyze
      - name: Analyze viewer
        working-directory: viewer
        run: flutter pub get && flutter analyze
      - name: Build web viewer
        working-directory: viewer
        run: flutter build web --release --no-tree-shake-icons
      - run: dart pub publish --dry-run
      # .pubignore mistakes silently drop sources from the package.
      - name: Check every library file is in the package
        run: |
          listing=$(dart pub publish --dry-run 2>&1)
          missing=0
          for f in $(git ls-files lib); do
            grep -q "── $(basename "$f") " <<< "$listing" || { echo "Not in the package: $f"; missing=1; }
          done
          exit $missing

  pana:
    # The same analysis pub.dev scores the package with.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate pana
      - name: Fail if the pub.dev score would drop by more than 20 points
        run: dart pub global run pana --no-warning --exit-code-threshold 20 .

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
