# Publishes a release when a version tag (v1.2.3) is pushed.
#
# Both registries use trusted publishing (OIDC), so no secrets are stored.
# Enable it once per registry after the first manual publish:
#  - pub.dev: package Admin > Automated publishing > GitHub Actions,
#    repository IGoOpen/remote-app-control, tag pattern v{{version}}.
#  - npm: package Settings > Trusted publishing > GitHub Actions,
#    workflow release.yml.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  pub-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Skip versions already on pub.dev, e.g. the first one, published by hand.
      - id: check
        run: |
          if curl -sf "https://pub.dev/api/packages/remote_app_control/versions/${GITHUB_REF_NAME#v}" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # Provides the pub.dev OIDC credentials; Flutter's own Dart publishes.
      - if: steps.check.outputs.published != 'true'
        uses: dart-lang/setup-dart@v1
      - if: steps.check.outputs.published != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: steps.check.outputs.published != 'true'
        run: flutter pub get && flutter test && dart pub publish --force

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the package version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - id: check
        run: |
          if npm view "@igoopen/remote-app-control@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.published != 'true'
        run: npm ci && npm publish --access public --provenance
